[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "scratchnet"
version = "0.1.0"
description = "A neural network written from scratch in NumPy, and an interactive website that shows how it learns."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Noah Lindner" }]
keywords = ["neural network", "backpropagation", "numpy", "education", "mnist"]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
train = ["scipy>=1.10"]
dev = ["pytest>=7.4", "ruff>=0.6", "scipy>=1.10"]

[project.urls]
Homepage = "https://github.com/noahli472-ai/neural-network-explained"
Demo = "https://noahli472-ai.github.io/neural-network-explained/"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the MNIST files (skipped if they are not downloaded)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N", "D", "ANN", "NPY"]
ignore = [
    "N803", # argument names like X, W follow mathematical notation
    "N806", # same for local variables
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "ANN"]
"scripts/**" = ["D103"]
"examples/**" = ["D103"]
